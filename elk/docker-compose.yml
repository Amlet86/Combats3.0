# Учебный ELK на ноутбуке: Filebeat читает ~/.combats/logs/bot*.json, кладёт записи в Elasticsearch,
# Kibana показывает их на http://localhost:5601. Запуск и работа в Kibana — в elk/README.md.
#
# Безопасность Elasticsearch выключена ради простоты: порты открыты только на 127.0.0.1,
# с других компьютеров стек недоступен. Наружу (на сервер, в интернет) так не выставлять.

name: combats-elk

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.18.0}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.18.0}
    environment:
      # русского перевода у Kibana нет, интерфейс на английском
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.18.0}
    user: root
    # конфиг смонтирован из Windows, и его права Filebeat проверить не может
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # логи бота; другую папку можно задать переменной COMBATS_LOGS
      - ${COMBATS_LOGS:-${USERPROFILE}/.combats/logs}:/logs:ro
      # что Filebeat уже прочитал: после перезапуска записи не задваиваются
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
  filebeat-data:
